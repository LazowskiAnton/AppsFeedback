name: Bug report
description: Something does not work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Issues are public: hide or replace company, product, project and person names and paths in screenshots (for example with `Contoso`).
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - LoupeSmith
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The bottom of the app's settings window.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings → System → About → Windows specifications.
      placeholder: "Windows 11 24H2, build 26100.2314"
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: How many monitors and the scale of each (Settings → System → Display). Many problems depend on it.
      placeholder: "Two monitors: 3840×2160 at 200 %, 1920×1080 at 100 %"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
      placeholder: |
        1. Press Ctrl+Alt+Z over a browser window
        2. …
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Drag a picture or a short video here if it shows the problem better than words.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private names and paths from everything above.
          required: true
